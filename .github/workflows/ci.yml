# Always-on gate: runs on every push and pull request.
#
# `mvn test` runs the `*Test.java` suites with assertions enabled — the store's
# internal invariants are `assert` statements, so a run with them disabled
# checks substantially less. The `*IT.java` stress and scale suites are tens of
# minutes and several GB of temporary files; they live behind the
# `integration-tests` profile and run on a schedule, not on every push.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 0"

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the compiler release target; the newer LTS catches anything the
        # release flag does not (behavioural changes, deprecations, GC defaults).
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B --no-transfer-progress verify

  # What a consumer actually receives. Guards against a build change that drops
  # the licence and notice from the JAR.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B --no-transfer-progress -DskipTests package
      - name: licence and notice are in the JAR
        run: |
          set -euo pipefail
          jar="$(ls target/mapdb-java-store-*.jar)"
          for f in LICENSE-EPL-1.0.txt LICENSE-EDL-1.0.txt NOTICE.md; do
            unzip -l "$jar" | grep -q "META-INF/$f" \
              || { echo "missing from JAR: META-INF/$f"; exit 1; }
          done

  # The long-running suites, on a schedule rather than per-push.
  integration:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B --no-transfer-progress -P integration-tests verify
